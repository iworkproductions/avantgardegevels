<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voorbeeld configurator · Avant-Garde</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--zwart:#16130f;--grijs:#6e675e;--licht:#9a9288;--lijn:rgba(22,19,15,.1);--vlak:#f3efe8;--creme:#faf8f4;--goud:#9c7a4a;--groen:#4f7a45;--veer:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--creme);color:var(--zwart);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,3vw);background:rgba(250,248,244,.8);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--lijn)}
.top img{height:20px;filter:brightness(0)}
.top a.home{font-size:14px;text-decoration:none;color:var(--grijs)}
.voorbeeld{font-size:13px;color:var(--goud)}

.hoofd{max-width:1560px;margin:0 auto;padding:clamp(28px,5vh,56px) max(20px,3vw) 140px}
.titel{margin-bottom:clamp(22px,3.5vh,40px)}
.titel h1{font-weight:400;font-size:clamp(36px,4.6vw,64px);letter-spacing:-.04em;line-height:1}
.titel p{margin-top:12px;font-size:18px;color:var(--grijs);font-weight:300}
.raster{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:clamp(28px,4vw,64px);align-items:start}

.podium{position:sticky;top:80px}
.beeld{position:relative;aspect-ratio:16/10;border-radius:28px;overflow:hidden;background:#e7e1d8;box-shadow:0 50px 100px -50px rgba(22,19,15,.45)}
.beeld img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .8s var(--veer)}
.beeld img.weg{opacity:0}
.beeld .na{z-index:1}
.beeld.vergelijk .na{clip-path:inset(0 0 0 var(--split,50%))}
.lijnv{display:none;position:absolute;z-index:3;top:0;bottom:0;left:var(--split,50%);width:2px;background:#fff;box-shadow:0 0 20px rgba(0,0,0,.35)}
.lijnv i{position:absolute;top:50%;left:50%;width:44px;height:44px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 8px 24px rgba(0,0,0,.25);display:grid;place-items:center;font-size:15px;color:var(--zwart);font-style:normal}
.beeld.vergelijk .lijnv{display:block}
.schuif{display:none;position:absolute;inset:0;z-index:4;width:100%;height:100%;opacity:0;cursor:ew-resize;touch-action:none}
.beeld.vergelijk .schuif{display:block}
.etiket{display:none;position:absolute;z-index:5;top:14px;font-size:12px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.etiket.l{left:14px}.etiket.r{right:14px}
.beeld.vergelijk .etiket{display:block}
.bediening{position:absolute;z-index:6;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.bediening>*{pointer-events:auto}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(22,19,15,.42);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.seg button{border:0;background:none;color:rgba(255,255,255,.85);font-size:13px;padding:8px 15px;border-radius:999px;transition:.3s var(--veer)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--zwart)}
.seg button:disabled{opacity:.35;cursor:default}
.onder{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px;padding:0 6px}
.onder .naam{font-size:15px}
.onder .naam span{color:var(--grijs)}
.meter{display:flex;align-items:center;gap:12px;min-width:240px}
.meter small{font-size:12px;color:var(--grijs);white-space:nowrap}
.meter .balk{flex:1;height:6px;border-radius:6px;background:rgba(79,122,69,.14);overflow:hidden}
.meter .balk i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#6d9162,#8fbf7f);transition:width .9s var(--veer)}
.meter b{font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}

.keuzes{display:grid;gap:clamp(30px,4vh,46px)}
.blok h2{font-weight:400;font-size:24px;letter-spacing:-.02em;line-height:1.2}
.blok h2 span{color:var(--licht)}
.blok .opties{display:grid;gap:10px;margin-top:16px}
.blok .opties.twee{grid-template-columns:1fr 1fr}
.optie{position:relative;display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-radius:18px;padding:12px;box-shadow:inset 0 0 0 1px var(--lijn);transition:box-shadow .25s,transform .2s var(--veer)}
.optie:hover{box-shadow:inset 0 0 0 1px rgba(22,19,15,.3)}
.optie:active{transform:scale(.985)}
.optie.aan{box-shadow:inset 0 0 0 2px var(--zwart)}
.optie img{width:74px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--vlak)}
.optie .t b{display:block;font-weight:500;font-size:15px}
.optie .t small{display:block;font-size:13px;color:var(--grijs);margin-top:2px;line-height:1.35}
.optie .plus{margin-left:auto;font-size:13px;color:var(--groen);white-space:nowrap;padding-left:8px}
.opties.twee .optie{flex-direction:column;align-items:stretch;padding:0;overflow:hidden}
.opties.twee .optie img{width:100%;height:auto;aspect-ratio:16/10;border-radius:0}
.opties.twee .optie .t{padding:11px 13px 13px}
.optie.tekst{padding:16px 16px}

.slot{background:var(--zwart);color:#fff;border-radius:24px;padding:24px}
.slot small{color:rgba(255,255,255,.6);font-size:13px}
.slot h3{font-weight:400;font-size:28px;letter-spacing:-.025em;margin:6px 0 8px}
.slot p{color:rgba(255,255,255,.72);font-size:15px;line-height:1.5}
.slot a{display:block;margin-top:18px;text-align:center;text-decoration:none;background:#fff;color:var(--zwart);border-radius:999px;padding:15px;font-size:15px}

.balkonder{position:fixed;z-index:50;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:10px 10px 10px 22px;border-radius:999px;background:rgba(22,19,15,.86);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);color:#fff;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);max-width:calc(100% - 24px)}
.balkonder .pk{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.balkonder .pk span{color:rgba(255,255,255,.6)}
.balkonder .kort{display:none}
.balkonder a{flex:none;text-decoration:none;background:#fff;color:var(--zwart);border-radius:999px;padding:11px 18px;font-size:14px}

@media(max-width:1000px){
 .raster{grid-template-columns:1fr;gap:18px}
 .podium{top:56px;z-index:30;margin:0 calc(-1*max(20px,3vw));padding:8px max(12px,3vw) 10px;background:rgba(250,248,244,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
 .beeld{border-radius:18px;aspect-ratio:16/9}
 .onder{margin-top:8px;padding:0 2px}
 .onder .naam{font-size:13px}
 .meter{min-width:0;flex:1;max-width:220px}
 .titel h1{font-size:34px}.titel p{font-size:16px}
 .hoofd{padding-top:22px}
}
@media(max-width:560px){
 .seg button{font-size:12px;padding:7px 11px}
 .bediening{left:8px;right:8px;bottom:8px}
 .onder .naam span{display:none}
 .meter small{display:none}
 .blok h2{font-size:21px}
 .balkonder{gap:10px;padding:8px 8px 8px 16px;left:12px;right:12px;transform:none;justify-content:space-between}
 .balkonder .pk span{display:none}
 .balkonder .lang{display:none}.balkonder .kort{display:inline}
 .top{background:rgba(250,248,244,.96)}
 .balkonder a{padding:10px 14px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><img src="/assets/logo-ag-wit.png" alt="Avant-Garde"><span class="voorbeeld">Voorbeeld</span><a class="home" href="/">Home</a></header>
<main class="hoofd">
  <div class="titel"><h1>Ontwerp uw woning.</h1><p>Kies, en zie uw huis direct veranderen.</p></div>
  <div class="raster">
    <section class="podium" aria-label="Uw woning">
      <div class="beeld" id="beeld">
        <img id="voor" alt="Huidige woning">
        <img id="naA" class="na" alt="Uw ontwerp"><img id="naB" class="na weg" alt="">
        <div class="lijnv"><i>⟷</i></div>
        <input class="schuif" id="schuif" type="range" min="0" max="100" value="50" aria-label="Vergelijk nu en straks">
        <span class="etiket l">Nu</span><span class="etiket r">Uw ontwerp</span>
        <div class="bediening">
          <div class="seg" role="group" aria-label="Tijdstip"><button id="dag" aria-pressed="true">Overdag</button><button id="avond" aria-pressed="false">Avond</button></div>
          <div class="seg"><button id="verg" aria-pressed="false">Vergelijk</button></div>
        </div>
      </div>
      <div class="onder"><div class="naam" id="naam"></div><div class="meter"><small>Duurzaamheidswinst</small><div class="balk"><i id="balk"></i></div><b id="pct">0%</b></div></div>
    </section>

    <section class="keuzes" id="keuzes"></section>
  </div>
</main>
<div class="balkonder"><div class="pk" id="pk"></div><a href="/#contact"><span class="lang">Plan een adviesgesprek</span><span class="kort">Adviesgesprek</span></a></div>

<script>
(function(){
var TYPES=[{k:'vrijstaand',n:'Vrijstaand huis',s:'Jaren-tachtig, zadeldak'},{k:'villa',n:'Villa',s:'Breed, met schilddak'},{k:'bungalow',n:'Bungalow',s:'Eén laag, plat dak'},{k:'hoek',n:'Hoekwoning',s:'Einde van een rij'}];
var st={type:'vrijstaand',gevel:'huidig',dak:'oud',kozijnen:'oud',wp:false,avond:false,verg:false,split:50};
var $=function(i){return document.getElementById(i)};
function nr(s){var b=s.gevel==='huidig'?1:s.gevel==='crepi'?5:9;return b+(s.kozijnen==='nieuw'?1:0)+(s.dak==='nieuw'?2:0)}
function pad(n){return (n<10?'0':'')+n}
function src(s,avond){return '/assets/samenstellen/'+s.type+'-'+(avond?'avond':pad(nr(s)))+'.jpg'}
function score(){var x=0;if(st.gevel==='crepi')x+=30;if(st.gevel==='avant')x+=40;if(st.dak==='nieuw')x+=15;if(st.kozijnen==='nieuw')x+=20;if(st.wp)x+=25;return Math.min(100,x)}
function pakket(){
 var g=st.gevel,d=st.dak==='nieuw',z=st.kozijnen==='nieuw',p;
 if(g==='avant'&&d&&z)p='Avant-Garde Compleet';else if(g==='avant'&&d)p='Look & Dak';else if(g==='avant')p='Avant-Garde Look';else if(g==='crepi')p='Avant-Garde Crepi';
 else if(d||z)p=[d?'Nieuw dak':'',z?'Nieuwe kozijnen':''].filter(Boolean).join(' en ');else p='Nog geen keuze';
 return p+(st.wp?' + warmtepomp':'');
}
var na=$('naA'),naAnder=$('naB');
function zet(el,u){if(el.getAttribute('src')!==u)el.src=u}
function beeld(){
 var compleet=nr(st)===12;if(!compleet)st.avond=false;
 var u=src(st,st.avond);
 zet($('voor'),src({type:st.type,gevel:'huidig',dak:'oud',kozijnen:'oud'}));
 if(na.getAttribute('src')!==u){var nieuw=naAnder,oud=na,img=new Image();img.onload=function(){nieuw.src=u;nieuw.classList.remove('weg');oud.classList.add('weg');na=nieuw;naAnder=oud;};img.src=u;}
 $('avond').disabled=!compleet;$('dag').setAttribute('aria-pressed',String(!st.avond));$('avond').setAttribute('aria-pressed',String(st.avond));
 var veranderd=nr(st)>1;if(!veranderd)st.verg=false;$('verg').parentNode.style.display=veranderd?'':'none';
 $('beeld').classList.toggle('vergelijk',st.verg);$('verg').setAttribute('aria-pressed',String(st.verg));$('beeld').style.setProperty('--split',st.split+'%');
 var t=TYPES.find(function(x){return x.k===st.type});$('naam').innerHTML=t.n+' <span>· impressie</span>';
 var p=score();$('balk').style.width=p+'%';$('pct').textContent=p+'%';
 $('pk').innerHTML='<span>Uw ontwerp</span> '+pakket();
 // voorladen
 [1,5,9,12].forEach(function(n){var i=new Image();i.src='/assets/samenstellen/'+st.type+'-'+pad(n)+'.jpg'});
}
function optie(groep,val,titel,sub,img,plus){var aan=st[groep]===val;return '<button class="optie'+(img?'':' tekst')+(aan?' aan':'')+'" data-g="'+groep+'" data-v="'+val+'">'+(img?'<img src="'+img+'" alt="" loading="lazy">':'')+'<span class="t"><b>'+titel+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</span>'+(plus?'<span class="plus">'+plus+'</span>':'')+'</button>'}
function keuzes(){
 var k=st.type,h='';
 h+='<div class="blok"><h2>Woning. <span>Welk type heeft u?</span></h2><div class="opties twee">'+TYPES.map(function(t){return optie('type',t.k,t.n,t.s,'/assets/samenstellen/'+t.k+'-01.jpg')}).join('')+'</div></div>';
 h+='<div class="blok"><h2>Gevel. <span>Welke uitstraling?</span></h2><div class="opties">'+
  optie('gevel','huidig','Huidige gevel','Zoals hij nu is','/assets/samenstellen/'+k+'-01.jpg')+
  optie('gevel','crepi','Avant-Garde Crepi','Nieuwe, geïsoleerde buitenschil in crepi','/assets/materialen/closeup-crepi.jpg','+30%')+
  optie('gevel','avant','Avant-Garde Look','Crepi met natuursteen en composiet houtlook','/assets/materialen/closeup-steen.jpg','+40%')+'</div></div>';
 h+='<div class="blok"><h2>Dak. <span>Nieuw of zo laten?</span></h2><div class="opties">'+
  optie('dak','oud','Huidig dak','',null)+optie('dak','nieuw',k==='bungalow'?'Nieuwe daktrim':'Nieuw dak','Nieuwe pannen en isolatie',null,'+15%')+'</div></div>';
 h+='<div class="blok"><h2>Kozijnen. <span>Het laatste detail.</span></h2><div class="opties">'+
  optie('kozijnen','oud','Huidige kozijnen','',null)+optie('kozijnen','nieuw','Nieuwe kozijnen','Aluminium antraciet, met nieuwe voordeur',null,'+20%')+'</div></div>';
 h+='<div class="blok"><h2>Warmtepomp. <span>Aanvulling op elk pakket.</span></h2><div class="opties">'+
  optie('wp','nee','Geen warmtepomp','',null)+optie('wp','ja','Met warmtepomp','Hybride of volledig elektrisch',null,'+25%')+'</div></div>';
 h+='<div class="blok slot"><small>Uw ontwerp</small><h3 id="slotpk">'+pakket()+'</h3><p>Wij maken een ontwerp voor uw eigen woning en komen vrijblijvend bij u langs.</p><a href="/#contact">Plan een adviesgesprek</a></div>';
 $('keuzes').innerHTML=h;
 [].forEach.call(document.querySelectorAll('.optie'),function(b){
  if(b.dataset.g==='wp'&&((b.dataset.v==='ja')===st.wp))b.classList.add('aan');
  b.onclick=function(){var g=b.dataset.g,v=b.dataset.v;if(g==='wp')st.wp=v==='ja';else st[g]=v;
   [].forEach.call(document.querySelectorAll('.optie[data-g="'+g+'"]'),function(x){x.classList.toggle('aan',x===b)});
   if(g==='type'){keuzes();}
   $('slotpk').textContent=pakket();beeld();};
 });
}
$('dag').onclick=function(){st.avond=false;beeld()};
$('avond').onclick=function(){st.avond=true;beeld()};
$('verg').onclick=function(){st.verg=!st.verg;beeld()};
$('schuif').oninput=function(){st.split=+this.value;$('beeld').style.setProperty('--split',st.split+'%')};
keuzes();beeld();
})();
</script>
</body>
</html>
